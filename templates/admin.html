<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lounge - Admin Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 font-sans antialiased">

    <!-- Login Overlay -->
    <div id="loginOverlay" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-stone-100">
            <h2 class="text-2xl font-bold text-stone-900 mb-2">Admin Portal</h2>
            <p class="text-sm text-stone-500 mb-6">Sign in to manage The Lounge reservations and settings.</p>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">Email</label>
                    <input type="email" id="loginEmail" required class="w-full px-4 py-2.5 rounded-lg border border-stone-300 focus:outline-none focus:ring-2 focus:ring-stone-900 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-600 mb-1">Password</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 rounded-lg border border-stone-300 focus:outline-none focus:ring-2 focus:ring-stone-900 text-sm">
                </div>
                <button type="submit" class="w-full py-3 bg-stone-900 text-white font-medium rounded-lg hover:bg-stone-800 transition text-sm">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Mobile Top Navigation Bar (Visible only on small screens) -->
    <nav class="bg-stone-900 text-white shadow-md md:hidden">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16 items-center">
                <span class="text-lg font-bold tracking-wide">The Lounge</span>
                <!-- Mobile Hamburger Button -->
                <button id="menu-btn" class="text-stone-300 hover:text-white focus:outline-none p-2 rounded-md">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
        <!-- Mobile Dropdown Menu -->
        <div id="mobile-menu" class="hidden px-4 pt-2 pb-4 space-y-2 border-t border-stone-800 bg-stone-900">
            <button onclick="switchView('overview'); toggleMobileMenu();" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium hover:bg-stone-800 text-stone-300 hover:text-white">Overview</button>
            <button onclick="switchView('reservations'); toggleMobileMenu();" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium hover:bg-stone-800 text-stone-300 hover:text-white">Reservations</button>
            <button onclick="logout()" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-red-400 hover:bg-stone-800">Sign Out</button>
        </div>
    </nav>

    <!-- Dashboard Layout -->
    <div class="flex h-screen overflow-hidden">
        
        <!-- Desktop Sidebar (Hidden on mobile) -->
        <aside class="w-64 bg-white border-r border-stone-200 flex-col justify-between hidden md:flex">
            <div class="p-6">
                <h1 class="text-xl font-bold tracking-tight text-stone-900 mb-8">The Lounge</h1>
                <nav class="space-y-1">
                    <a href="#" data-view="overview" id="nav-overview" onclick="switchView('overview')" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg bg-stone-900 text-white transition">Overview</a>
                    <a href="#" data-view="reservations" id="nav-reservations" onclick="switchView('reservations')" class="flex items-center px-4 py-2.5 text-sm font-medium rounded-lg text-stone-600 hover:bg-stone-100 hover:text-stone-900 transition">Reservations</a>
                </nav>
            </div>
            <div class="p-6 border-t border-stone-200">
                <button onclick="logout()" class="w-full flex items-center justify-center px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition">Sign Out</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <!-- Top Header -->
            <header class="bg-white border-b border-stone-200 px-8 py-4 flex justify-between items-center">
                <h2 class="text-lg font-bold text-stone-900" id="pageTitle">Dashboard Overview</h2>
                <div class="flex items-center space-x-4">
                    <span class="text-sm font-medium text-stone-600" id="adminUserEmail">admin@thelounge.local</span>
                </div>
            </header>

            <!-- Overview View -->
            <div id="overviewView" class="dashboard-view p-8 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-xl border border-stone-200 shadow-sm">
                        <p class="text-xs font-semibold uppercase tracking-wider text-stone-500">Today's Bookings</p>
                        <h3 class="text-3xl font-bold text-stone-900 mt-2" id="statTodayBookings">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-stone-200 shadow-sm">
                        <p class="text-xs font-semibold uppercase tracking-wider text-stone-500">Pending Approvals</p>
                        <h3 class="text-3xl font-bold text-stone-900 mt-2" id="statPending">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-stone-200 shadow-sm">
                        <p class="text-xs font-semibold uppercase tracking-wider text-stone-500">Total Reservations</p>
                        <h3 class="text-3xl font-bold text-stone-900 mt-2" id="statTotal">0</h3>
                    </div>
                </div>
            </div>

            <!-- Reservations View -->
            <div id="reservationsView" class="dashboard-view p-8 space-y-6 hidden">
                <div class="bg-white rounded-xl border border-stone-200 shadow-sm p-6">
                    <h2 class="text-base font-bold text-stone-900 mb-4">All Customer Reservations</h2>
                    <!-- Wrapped in overflow-x-auto for mobile horizontal scrolling -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[600px]">
                            <thead>
                                <tr class="border-b border-stone-200 text-xs font-semibold uppercase tracking-wider text-stone-500">
                                    <th class="pb-3 px-4">Customer</th>
                                    <th class="pb-3 px-4">Date & Time</th>
                                    <th class="pb-3 px-4">Guests</th>
                                    <th class="pb-3 px-4">Status</th>
                                    <th class="pb-3 px-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="reservationsTableBody" class="divide-y divide-stone-100">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Menu Toggle Script -->
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');

        function toggleMobileMenu() {
            mobileMenu.classList.toggle('hidden');
        }

        menuBtn.addEventListener('click', toggleMobileMenu);
    </script>
    
    <!-- Script Logic -->
    <script>
        // Token Management via Local Storage
        function getToken() {
            return localStorage.getItem('lounge_admin_token');
        }

        function setToken(token) {
            if (token) {
                localStorage.setItem('lounge_admin_token', token);
            } else {
                localStorage.removeItem('lounge_admin_token');
            }
        }

        // Authenticated API Helper pointing to Flask Routes
        async function apiFetch(url, options = {}) {
            const token = getToken();
            headers = options.headers || {};
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            headers['Content-Type'] = 'application/json';
            options.headers = headers;

            const response = await fetch(url, options);
            if (response.status === 401) {
                logout();
                throw new Error('Unauthorized');
            }
            return response;
        }

        // View Switching Logic
        function switchView(viewName) {
            document.querySelectorAll('.dashboard-view').forEach(el => el.classList.add('hidden'));
            const targetView = document.getElementById(viewName + 'View');
            if (targetView) targetView.classList.remove('hidden');

            document.querySelectorAll('aside nav a').forEach(link => {
                link.classList.remove('bg-stone-900', 'text-white');
                link.classList.add('text-stone-600', 'hover:bg-stone-100', 'hover:text-stone-900');
            });

            const activeLink = document.querySelector(`[data-view="${viewName}"]`);
            if (activeLink) {
                activeLink.classList.remove('text-stone-600', 'hover:bg-stone-100', 'hover:text-stone-900');
                activeLink.classList.add('bg-stone-900', 'text-white');
            }

            document.getElementById('pageTitle').textContent = viewName === 'overview' ? 'Dashboard Overview' : 'Customer Reservations';

            if (viewName === 'reservations' || viewName === 'overview') {
                loadDashboardData();
            }
        }

        // Authentication & Session Handlers
        function hideLogin() {
            document.getElementById('loginOverlay').classList.add('hidden');
        }

        function logout() {
            setToken(null);
            document.getElementById('loginOverlay').classList.remove('hidden');
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    setToken(data.access_token);
                    hideLogin();
                    document.getElementById('adminUserEmail').textContent = username;
                    loadDashboardData();
                } else {
                    alert('Login failed: ' + (data.error || 'Invalid credentials'));
                }
            } catch (err) {
                alert('Network error during login.');
                console.error(err);
            }
        }

        function checkSession() {
            const token = getToken();
            if (token) {
                hideLogin();
                loadDashboardData();
            } else {
                document.getElementById('loginOverlay').classList.remove('hidden');
            }
        }

        // Formatting Helpers
        function normalizeStatus(status) {
            return (status || 'pending').toLowerCase();
        }

        function formatStatus(status) {
            const norm = normalizeStatus(status);
            return norm.charAt(0).toUpperCase() + norm.slice(1);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Data Fetching via Flask Backend APIs
        async function loadDashboardData() {
            try {
                const response = await apiFetch('/api/bookings');
                if (!response.ok) throw new Error('Failed to fetch bookings');
                const bookings = await response.json();

                // Update Stats
                document.getElementById('statTotal').textContent = bookings.length;
                const pendingCount = bookings.filter(b => normalizeStatus(b.status) === 'pending').length;
                document.getElementById('statPending').textContent = pendingCount;

                const todayStr = new Date().toISOString().split('T')[0];
                const todayCount = bookings.filter(b => b.booking_date === todayStr).length;
                document.getElementById('statTodayBookings').textContent = todayCount;

                // Render Reservations Table if visible
                const tbody = document.getElementById('reservationsTableBody');
                if (tbody) {
                    if (bookings.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="py-4 px-4 text-center text-stone-500 text-sm">No reservations found.</td></tr>';
                        return;
                    }

                    tbody.innerHTML = bookings.map(res => `
                        <tr class="hover:bg-stone-50/50 transition">
                            <td class="py-3 px-4">
                                <div class="font-medium text-stone-900">${escapeHtml(res.full_name || 'Guest')}</div>
                                <div class="text-xs text-stone-500">${escapeHtml(res.email || '')}</div>
                            </td>
                            <td class="py-3 px-4 text-sm text-stone-600">${escapeHtml(res.booking_date || '')} ${escapeHtml(res.booking_time || '')}</td>
                            <td class="py-3 px-4 text-sm text-stone-600">${escapeHtml(res.guests || 1)}</td>
                            <td class="py-3 px-4">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-stone-100 text-stone-800">
                                    ${formatStatus(res.status)}
                                </span>
                            </td>
                            <td class="py-3 px-4 text-right space-x-2">
                                <button onclick="updateStatus('${res.id}', 'confirmed')" class="text-xs font-medium text-emerald-600 hover:text-emerald-800">Confirm</button>
                                <button onclick="updateStatus('${res.id}', 'cancelled')" class="text-xs font-medium text-red-600 hover:text-red-800">Cancel</button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                console.error('Error loading dashboard data:', err);
                const tbody = document.getElementById('reservationsTableBody');
                if (tbody) {
                    tbody.innerHTML = '<tr><td colspan="5" class="py-4 px-4 text-center text-red-500 text-sm">Failed to load reservations.</td></tr>';
                }
            }
        }

        async function updateStatus(id, newStatus) {
            try {
                const response = await apiFetch(`/api/bookings/${id}/status`, {
                    method: 'PUT',
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await response.json();
                if (response.ok && data.success) {
                    loadDashboardData();
                } else {
                    alert('Error updating status: ' + (data.error || 'Unknown error'));
                }
            } catch (err) {
                alert('Error updating status request failed.');
                console.error(err);
            }
        }

        // Initialize on Load
        document.addEventListener('DOMContentLoaded', () => {
            checkSession();
        });
    </script>
</body>
</html>
